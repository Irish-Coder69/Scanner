name: Build And Release Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip --disable-pip-version-check --progress-bar off

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              python -m pip install -r requirements.txt --disable-pip-version-check --progress-bar off --retries 5 --timeout 60
              Write-Host "Dependency install succeeded on attempt $attempt"
              break
            }
            catch {
              if ($attempt -eq $maxAttempts) {
                throw
              }
              Write-Warning "Dependency install failed on attempt $attempt. Retrying..."
            }
          }

      - name: Validate release tag matches version.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content version.json | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            Write-Error "Tag $tag does not match version.json v$version"
            exit 1
          }

      - name: Build scanner icon and EXE
        shell: pwsh
        run: |
          python -c "from scanner_app import create_default_icon; create_default_icon('scanner_icon.ico', overwrite=True)"
          python -m PyInstaller --onefile --windowed --icon=scanner_icon.ico --name "Document Scanner" scanner_app.py

      - name: Prepare code-signing certificate
        shell: pwsh
        run: |
          $certB64 = "${{ secrets.CODE_SIGN_CERT_BASE64 }}"
          $certPassword = "${{ secrets.CODE_SIGN_CERT_PASSWORD }}"
          if ([string]::IsNullOrWhiteSpace($certB64) -or [string]::IsNullOrWhiteSpace($certPassword)) {
            Write-Host "Code-signing secrets not configured; skipping signing steps."
            return
          }
          $certBytes = [System.Convert]::FromBase64String($certB64)
          [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx", $certBytes)
          Set-Content -Path "$env:RUNNER_TEMP\codesign.pass" -Value $certPassword -NoNewline -Encoding UTF8

      - name: Sign EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP\codesign.pfx")) {
            Write-Host "No code-signing certificate found; skipping EXE signing."
            return
          }
          $certPassword = Get-Content "$env:RUNNER_TEMP\codesign.pass" -Raw
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw "signtool.exe not found on runner"
          }
          & $signtool sign /f "$env:RUNNER_TEMP\codesign.pfx" /p "$certPassword" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "dist\Document Scanner.exe"

      - name: Sync installer version from version.json
        shell: pwsh
        run: |
          $version = (Get-Content version.json | ConvertFrom-Json).version
          $iss = Get-Content installer.iss -Raw
          $iss = [regex]::Replace($iss, '(?m)^AppVersion=.*$', "AppVersion=$version")
          Set-Content installer.iss $iss -Encoding UTF8

      - name: Build installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: installer.iss

      - name: Normalize installer filename
        shell: pwsh
        run: |
          Copy-Item "installer_output\DocumentScannerSetup.exe" "installer_output\installer.exe" -Force

      - name: Sign installer
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP\codesign.pfx")) {
            Write-Host "No code-signing certificate found; skipping installer signing."
            return
          }
          $certPassword = Get-Content "$env:RUNNER_TEMP\codesign.pass" -Raw
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw "signtool.exe not found on runner"
          }
          & $signtool sign /f "$env:RUNNER_TEMP\codesign.pfx" /p "$certPassword" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "installer_output\installer.exe"

      - name: Verify signatures
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP\codesign.pfx")) {
            Write-Host "No code-signing certificate found; skipping signature verification."
            return
          }
          Get-AuthenticodeSignature "dist\Document Scanner.exe" | Format-List Status,SignerCertificate,TimeStamperCertificate
          Get-AuthenticodeSignature "installer_output\installer.exe" | Format-List Status,SignerCertificate,TimeStamperCertificate

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer_output/installer.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/installer.exe
          generate_release_notes: true
